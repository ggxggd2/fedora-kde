
[supervisord]
nodaemon=true
user=root
logfile=/dev/null
pidfile=/tmp/supervisord.pid

[program:xvfb]
command=/usr/bin/Xvfb :0 -screen 0 1920x1080x24
autorestart=true
priority=10

[program:desktop]
command=/start-desktop.sh
environment=DISPLAY=":0"
autorestart=true
priority=20

[program:vnc]
command=/bin/bash -lc 'until [ -S /tmp/.X11-unix/X0 ]; do sleep 1; done; x11vnc -display :0 -forever -shared -rfbport 5900 -passwd "$ims98gyt"'
autorestart=true
priority=30

[program:novnc]
command=/usr/bin/websockify --web=/usr/share/novnc 6080 localhost:5900
autorestart=true
priority=40
