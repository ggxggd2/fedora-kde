
services:
  qemu:
    image: docker.io/qemux/qemu:latest
    container_name: qemu

    environment:
      BOOT: "fedora"
      CPU_CORES: "8"
      RAM_SIZE: "128G"
      DISK_SIZE: "1T"
      DISPLAY: "web"
      WEB: "Y"
      WEB_PORT: "8006"
      AUDIO: "Y"

    devices:
      - /dev/kvm
      - /dev/net/tun

    cap_add:
      - NET_ADMIN

    ports:
      - "8006:8006"

    volumes:
      - ./qemu:/storage

    restart: always
    stop_grace_period: 2m
